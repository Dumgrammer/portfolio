<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Karl Bastian Lacap — AWS Certified Cloud Practitioner, BS IT Cum Laude. Software engineering, QA, and cloud."
    />
    <title>Karl Lacap — Portfolio</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("karl-theme");
          var dark =
            stored === "dark" ||
            ((stored === "system" || !stored) &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
