name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify images are real binaries (not LFS pointers)
        run: |
          file public/AWSCC.jpg
          python - <<'PY'
          from pathlib import Path
          p = Path("public/AWSCC.jpg")
          head = p.read_bytes()[:64]
          if head.startswith(b"version https://git-lfs.github.com"):
              raise SystemExit("AWSCC.jpg is still an LFS pointer — checkout lfs failed")
          print(f"OK {p} ({p.stat().st_size} bytes)")
          PY

      - name: Build
        run: npm run build
        env:
          BASE_PATH: portfolio

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
